name: Build MateEngineX (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Standalone
    runs-on: windows-latest
    timeout-minutes: 90
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Packages/**', 'Assets/**') }}
          restore-keys: |
            Library-${{ runner.os }}-
      
      - name: Download Unity
        run: |
          $unityUrl = "https://download.unity3d.com/download_unity/4a4dcaec6541/Windows64EditorInstaller/UnitySetup64-6000.2.6f2.exe"
          $installerPath = "UnitySetup.exe"
          Invoke-WebRequest -Uri $unityUrl -OutFile $installerPath -UseBasicParsing
          
      - name: Install Unity
        run: |
          $installArgs = "/S /D=C:\Unity\6000.2.6f2"
          Start-Process -FilePath "UnitySetup.exe" -ArgumentList $installArgs -Wait -NoNewWindow
          # Add Unity to PATH
          echo "C:\Unity\6000.2.6f2\Editor" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          
      - name: Verify Unity Installation
        run: |
          & "C:\Unity\6000.2.6f2\Editor\Unity.exe" -version
          
      - name: Build Windows
        run: |
          $unityPath = "C:\Unity\6000.2.6f2\Editor\Unity.exe"
          $buildArgs = @(
            "-batchmode",
            "-projectPath", ".",
            "-executeMethod", "BuildScript.PerformBuild",
            "-logFile", "-",
            "-quit",
            "-buildTarget", "StandaloneWindows64"
          )
          & $unityPath $buildArgs
          
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MateEngineX-Windows
          path: build/
          retention-days: 7